<span class="row">
  <strong>{{ subject }}</strong>
  {% if whole_corpus %}
  <span class="warn">&mdash; {{ "confirm-whole-corpus"|t }}</span>
  {% else %}
  {{ "confirm-matching"|t }} {% for f in filters %}<span class="tag good">{{ f }}</span>{% endfor %}
  {% endif %}
  &rarr; <strong>{{ language }}</strong>
  {% for song in songs %}<input type="hidden" name="song_id" value="{{ song }}">{% endfor %}
  <button class="primary" hx-post="/songs/language-bulk?{{ query }}&amp;confirm=1"
          hx-target="#bulk-language-result" hx-swap="innerHTML"
          hx-include="#bulk-language">{{ confirm }}</button>
  <button type="button" hx-get="/songs/language-bulk/cancel"
          hx-target="#bulk-language-result" hx-swap="innerHTML">{{ "action-cancel"|t }}</button>
</span>
