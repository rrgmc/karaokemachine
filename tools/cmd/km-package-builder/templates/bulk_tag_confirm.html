<span class="row">
  <strong>{{ subject }}</strong>
  {% if whole_corpus %}
  <span class="warn">&mdash; {{ "confirm-whole-corpus"|t }}</span>
  {% else %}
  {{ "confirm-matching"|t }} {% for f in filters %}<span class="tag good">{{ f }}</span>{% endfor %}
  {% endif %}
  &rarr; {% if removing %}{{ "confirm-without"|t }}{% else %}{{ "confirm-with"|t }}{% endif %} <strong>{{ tag }}</strong>
  {% for song in songs %}<input type="hidden" name="song_id" value="{{ song }}">{% endfor %}
  <button class="primary" hx-post="/songs/tag-bulk?{{ query }}&amp;confirm=1"
          hx-target="#bulk-tag-result" hx-swap="innerHTML"
          hx-include="#bulk-tag">{{ confirm }}</button>
  <button type="button" hx-get="/songs/tag-bulk/cancel"
          hx-target="#bulk-tag-result" hx-swap="innerHTML">{{ "action-cancel"|t }}</button>
</span>
