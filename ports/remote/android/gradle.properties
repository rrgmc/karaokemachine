android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m

# The native libraries are built by cargo, not by Gradle. `tools/port/remote/android/build.sh` produces
# them and `tools/port/remote/android/stage.sh` copies them into app/src/main/jniLibs, where the plugin
# looks.
# There is no externalNativeBuild block anywhere in this project on purpose.
android.defaults.buildfeatures.buildconfig=false
