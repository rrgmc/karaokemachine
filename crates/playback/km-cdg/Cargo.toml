[package]
name = "km-cdg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "MP3+G songs: a CD+G graphics renderer and an MP3 feed, both in pure Rust."

[lints]
workspace = true

# **There is deliberately no feature here, and the absence is the point.** `km-video` has one because
# ffmpeg is a C dependency that a workspace build must not require; nothing in this crate is optional
# in that sense -- the renderer is ours and the MP3 decoder is pure Rust -- so there is no build that
# can catalog an MP3+G song and not play it. That is why `km-app/src/cdg.rs` has no `AVAILABLE`
# const and no second `mod imp`, and it is what lets an MP3+G song play in a `--no-video` build and
# on Android. See the `MP3+G as a song source` decision in docs/decisions/.

[dependencies]
km-audio = { workspace = true }
# Measuring an MP3's level for the package being built. A leaf over `ebur128` with no features of its
# own, so the boast above survives it: this crate still has no optional anything.
km-loudness = { workspace = true }
symphonia = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# For `examples/preview.rs`, which renders a real `.cdg` to PNG. The same trick `km-display` uses to
# judge a screen on a machine with no monitor, and the fastest way to tell a working renderer from a
# plausible one.
image = { workspace = true }
