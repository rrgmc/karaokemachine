# postinst creates the /usr/bin symlink and postrm removes it. Not shipped as a file in the package
# because the target lives in /opt and dpkg would rather own a real path than a dangling one during
# unpack ordering.
maintainer-scripts = "debian"

# **Two variants, and the section above is the third build.** A variant is what lets one manifest
# hold three packages that differ only in what they depend on and what they carry, which is a thing
# a shell flag cannot reach: `[package.metadata.deb]` is static TOML and deb.sh's `--system-ffmpeg`
# is an argument. `name` is pinned in both, because cargo-deb otherwise appends the variant's name to
# the package's and these are one package built three ways rather than three packages.
#
# | build                      | variant          | ffmpeg      |
# |----------------------------|------------------|-------------|
# | `deb.sh --no-video`        | none, the above  | none at all |
# | `deb.sh`                   | `bundled-ffmpeg` | in `lib/`   |
# | `deb.sh --system-ffmpeg`   | `system-ffmpeg`  | Debian's    |
#
# The section above is therefore correct on its own terms: with no video feature there is no ffmpeg
# to depend on or to carry, and the dependency list is already right for it.

# Video, with the four libraries inside the package. **The default build.**
#
# `merge-assets.append` rather than a second `assets` list, which would be the whole of the one above
# copied for the sake of a line -- and the copy that goes stale is how the wallpaper zip came to be
# missing from this carrier for a month. deb-in-container.sh stages the libraries under their sonames
# into this directory and patchelfs `$ORIGIN` into each; the binary gets `$ORIGIN/lib`.
#
# **`libstdc++6` is named here and nowhere else**, because the library that needs it is one this
# package carries: libopenh264 is C++ where everything else in `lib/` is C. Nothing in the binary's
# own dynamic section mentions it, so there is no mechanism -- `$auto` included -- that could have
# worked it out, and a box without it gets a libavcodec that will not load.
[package.metadata.deb.variants.bundled-ffmpeg]
name = "karaokemachine"
depends = "libasound2t64 (>= 1.1.0), libc6 (>= 2.39), libgcc-s1 (>= 3.0), libstdc++6 (>= 5), libdrm2, libgbm1, libegl1, libgles2, libgl1-mesa-dri, libudev1, fonts-dejavu-core"
merge-assets.append = [
    ["target/release/kmffmpeg/*.so.*", "opt/karaokemachine/lib/", "644"],
    # The LGPL text and openh264's, beside the libraries they cover. Shipping the libraries is what
    # makes carrying these required.
    ["target/release/kmffmpeg/ffmpeg-COPYING.LGPLv2.1.txt", "usr/share/doc/karaokemachine/", "644"],
    ["target/release/kmffmpeg/openh264-LICENSE.txt", "usr/share/doc/karaokemachine/", "644"],
]

# Video against the distribution's own ffmpeg. **Not the default, and the one a distribution packager
# wants**: vendored libraries are what Debian policy tells a packager not to ship, and this is the
# build that ships none.
#
# `$auto` comes back here and earns its keep exactly as it did -- km-video links the four ffmpeg
# libraries normally, so shlibdeps really can see them and no list here needs a video entry. X11
# returns to `depends` with it, because Debian's libavutil drags libX11 in regardless and a
# Recommends that cannot be declined is a Recommends that lies.
[package.metadata.deb.variants.system-ffmpeg]
name = "karaokemachine"
depends = "$auto, libx11-6, libxext6, libxrandr2, libxcursor1, libxi6, libxfixes3, libxss1, libxtst6, libxrender1, libdrm2, libgbm1, libegl1, libgles2, libgl1-mesa-dri, libudev1, fonts-dejavu-core"
# A variant's `recommends` replaces the base's rather than adding to it, so `karaokemachine-tools`
# is named again here. Leaving it out would make the tools a desktop's default on one build and not
# on the other, which is the kind of difference nobody would look for.
recommends = "karaokemachine-tools, libwayland-client0, libwayland-cursor0, libwayland-egl1, libxkbcommon0, libdecor-0-0, libgl1"
