# The appliance's power button.
#
# **This pins systemd's own default rather than changing it.** `HandlePowerKey=poweroff` is what a
# stock Debian already does, so on a box that has only ever been an appliance this file changes
# nothing at all. What it defends against is the population deploy.sh already warns about for
# display managers: a box repurposed from a desktop, where a desktop environment's package has set
# this to `ignore` or `suspend`. On a machine under a television that is the one control there is,
# and it would silently do nothing.
#
# **The package ships this to /opt and does not install it**, exactly as it ships the unit disabled.
# A unit file on disk is inert until something enables it; a file under /etc/systemd/logind.conf.d/
# is live the moment it exists, so there is no "shipped but off" state for it to be in. Putting a
# desktop's power button to a different use must not be a side effect of `apt-get install`.
# tools/platform/linux/deploy.sh is what copies it into place -- the same step that seizes tty1.
#
# It applies at the next boot: logind has no reload, and restarting it underneath a PAM session
# that is holding DRM master is a risk for no gain when the file only restates the default.
#
# **A long press is left alone deliberately.** `HandlePowerKeyLongPress` stays unset (`ignore`), so
# holding the button remains what the firmware does with it -- the hard cut somebody reaches for
# when the machine has stopped answering, which is the one case a software handler cannot serve.
[Login]
HandlePowerKey=poweroff
