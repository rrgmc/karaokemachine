[sc55-1996]
# **The bank that proved the output needed a limiter, and it is here to keep proving it.** It loads
# cleanly, plays five of the note's seven songs at an ordinary level, and on *Exagerado* and
# *25 or 6 to 4* reaches a pre-clamp peak of 2.2e19 -- a divergence rather than a hot mix. `km-audio`
# handed that straight to the driver on the `F32` path until §13; `audio.rs`'s `limit` is the fix and
# this file is the fixture.
#
# **It carries no `volume`, and that is the finding rather than an omission.** §12's method returns
# 0.0 for it, which would silence the bank -- a level is a reduction, and no reduction rescues a
# number nineteen orders of magnitude over full scale. Its 25.5 LU spread is not comparable with any
# other row here either.
