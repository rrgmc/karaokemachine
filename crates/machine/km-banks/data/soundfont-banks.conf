# The General MIDI banks this repository knows about, written down once.
#
# **Three readers now, in two languages, and that is the whole reason this file exists rather than a
# `case` inside a shell script.** `tools/setup/soundfont-banks.sh` reads it for the commands that
# fetch and play a bank; `crates/machine/km-banks` compiles it in with `include_str!` so the machine
# can offer the same list from a phone, and so that `tools/cmd/assets/km-admin` can fetch a bank on
# a desktop for a machine that has no internet. The same bargain `tools/setup/features.sh` and
# `tools/platform/linux/apt-deps.sh` make -- one definition, several readers -- and it is load-bearing
# here in a way it was not before: a second copy of a digest is a download that verifies against the
# wrong number.
#
# **The third reader is why this moved out of `karaokemachine` and into a crate of its own.** The
# desktop tool cannot depend on the machine, which links SDL3, and it cannot learn a download address
# from the API either: `SoundFontOfferDto` carries a bank's size, license and note, and deliberately
# not its URL or its digest. So the table had to live somewhere both could reach.
#
# ## Nine of these are offered, and the rest are here to be tested against
#
# **`rank` is the field that separates them.** A ranked row appears on the machine's Setup tab with a
# button; an unranked one appears nowhere a singer can see and is reached from a shell, through
# `task soundfont BANK=<id>` and the `Ctrl+1`..`Ctrl+9` switcher. Nine because the switcher has nine
# keys and a phone has one screen -- not because the measurements imply it. Rank 1 is the bundled
# bank, so the tab shows eight buttons: a row inviting somebody to download the bank they are already
# listening to would be nonsense.
#
# The unranked rows are the second survey's field, and they are here rather than in a note because a
# bank you cannot fetch is a bank nobody will check. Most of them are worse than what ships. That is
# the point of keeping them: the next person to ask "is there something better?" should be able to
# hear the answer rather than re-download four gigabytes to find out.
#
# ## The format, and why it is not TSV
#
# Blocks introduced by `[id]`, then `key<space or tab>value` lines, `#` comments, blank lines ignored.
# A value runs to the end of the line and may contain spaces; it is never quoted.
#
# Nineteen fields exist and a typical row uses eight -- two banks are published inside an archive,
# only two ship a license file, only one is `manual`. As a table that is mostly empty columns, and as
# columns it is unreadable at the width real values need. Records keep each bank's prose beside it,
# which is most of what this file is: the reasoning below is not decoration, it is why a URL is
# pinned to a commit rather than a branch.
#
# Neither reader needs a parser: the shell splits on the first run of whitespace, and the Rust side
# does the same. **There is no `jq` and no `python` on the development box by policy**, which rules
# out JSON and TOML for the shell half.
#
# **It must check out with LF endings**, which `.gitattributes` pins by extension. Without that rule
# the shell reader silently found no bank at all on Windows, and `task dist:bin` died on the bundled
# one. The CR is carried by `km_bank`'s `read -r` loop and not by the `sed` that builds `KM_BANKS` --
# Git Bash's sed reads in text mode and strips it -- so it was one reader of the two, failing every
# lookup while the list of names looked perfectly correct. Both halves tolerate a stray CR now, the
# way the Rust reader always did with `trim_end()`; the pin is still what should keep one out.
#
# ## The fields
#
#   rank                  1..9 for a bank the machine offers, absent for one that is here to be
#                         tested against. See the section above; `OFFERED` in km-banks is the 9
#   status                bundled | pinned | manual
#   name                  what the file is called in the cache. **Unique across the table**, because
#                         `Machine::measured_level` joins a chosen bank to its row by filename
#   url                   a direct download, for `pinned`
#   digest                `<sha256 hex>`, or `sha1:<hex>` -- see "Two kinds of digest" below
#   bytes                 the exact size, which is also how each row below was confirmed to be the
#                         file the research note measured rather than a same-named different one
#   size                  that size the way the note writes it, for the listing
#   archive / archive_digest / member
#                         a bank published only inside a zip: fetch the archive, verify it, take one
#                         member
#   page                  where a person goes for a `manual` bank
#   volume                the `music_volume` this bank wants, where it has one. **Derived from the
#                         largest pre-clamp peak the bank reaches across the note's seven songs, not
#                         from a true peak read off the rendered file** -- `write_wav` clamps, so
#                         ffmpeg cannot see an overshoot that has already been flattened, and a bank
#                         reduced by that column goes on clipping. `soundfont-measure.sh` prints
#                         the pre-clamp peak directly, which is the number to derive from.
#                         **A hundredth, not a tenth** -- the rule is the same, the largest step that
#                         clears the peak, but a tenth throws away up to a whole step for nothing:
#                         Chorium clears at 0.69 and was handed 0.6, 1.2 dB it did not have to lose,
#                         which is enough to lose a comparison. Found by listening, not by arithmetic
#   spread                song-to-song loudness spread in LU -- the metric this project decided on.
#                         Lower is better; the bundled bank is 7.8
#   lufs                  mean integrated loudness across the note's seven songs, at
#                         `music_volume: 1.0`. **This is the reference a video or MP3+G song is
#                         attenuated to**, so it is read by the machine rather than only shown --
#                         see `Video and MP3+G play at the MIDI reference level` in
#                         docs/decisions/audio.md. `soundfont-measure.sh` prints it as `Mean LUFS`.
#                         A row without one falls back to `km_loudness::DEFAULT_REFERENCE_LUFS`,
#                         which is what an unmeasured bank of somebody's own gets too.
#                         **Measured at `music_volume: 1.0` on purpose, so `volume` above does not
#                         enter into it**: the owner's level multiplies a MIDI song and a media song
#                         alike, so it cancels out of the difference between them and the reference
#                         has to be the level before it
#   license               short form of §8's finding
#   note                  one line of what the note concluded, for the listing
#   lic_name / lic_url / lic_digest
#                         a license file that travels with the bank, where one exists. **Cached under
#                         a bank-qualified name**, because `LICENSE.txt` is not unique and the cache
#                         is shared; it is installed under `lic_name` itself, which is what ships
#                         beside the bank
#   bundled               1 for the one bank that is installed into `assets/` and shipped
#
# **Every row here comes out of one survey**, which measured sixty-eight banks through this
# machine's own engine. Sizes, spreads, licenses and the `volume` numbers are its findings and are
# not re-derived here; what this file adds is where each one can be fetched from.
#
# **Every `spread` below is a fork measurement**, re-run for §13 at one revision. The numbers this
# file carried until then were `rustysynth` 1.3.6's, which is why the bundled bank reads 7.8 here and
# 6.7 in §4: implementing the SF2 modulators 1.3.6 discarded cost it 1.1 LU of the one metric it was
# chosen on. Do not mix a §4 number with a §13 one.
#
# **Everything in the table loads.** §3's "seven of eighteen files do not load" was a property of the
# synthesizer rather than of the banks: the fork drops a defective record instead of refusing the
# file, and all sixty-eight of the second survey's banks opened. Two things still do not, and neither
# is a record to drop: an Ogg-compressed `smpl` (`.sf3`) and Polyphone's `sfpk` container.
#
# Worth knowing before adding a row: **loading is not the same as being usable.** Both Timbres of
# Heaven files exceed full scale on all seven of the note's songs at `music_volume: 1.0`, and the
# levels they actually need are 0.20 and 0.14 -- not the "roughly 0.3" §11 guessed, which is the
# third time an estimated level has turned out short.
#
# And a level is not the same as being *comparable*. It is derived from the loudest of seven songs
# and applied to all of them, so a bank whose peak comes from one song is over-attenuated on the
# other six: FluidR3 needs 0.88 on one real song and 0.61 on another. Nothing here fixes that, and a
# bank that arrives quiet in an A/B is a bank that loses it.
#
# ## Two kinds of digest, and why that is not a compromise
#
# A bare value is a sha256 this repository computed from the bytes it fetched. `sha1:` is the digest
# **archive.org publishes for that file in its own item metadata**, read from
# `https://archive.org/metadata/<item>`.
#
# Most rows here are pinned that way, and the reason has changed since the six that started it. It
# was speed: that host was measured at about 30 KB/s, so hashing the banks locally meant hours. **It
# is not slow any more** -- the second survey pulled 3.6 GiB from one item at about 1.5 MB/s, fifty
# times that -- so what the sha1 is doing now is what it always really did: pinning exactly the bytes
# the archive already attests to, over the same HTTPS origin, so a corrupted or silently replaced
# download fails loudly instead of landing in a build. Every one of the fifty-four files in that item
# was fetched and verified against this manifest, and none mismatched.
#
# **The item is a faithful mirror, and that was checked rather than assumed.** Three of its files
# match rows already confirmed against the research note, exactly: `FluidR3_GM2-2.SF2` is the
# 148,345,256 bytes `fluidr3` names as its zip member, `SGM-V2.01.sf2` carries the identical sha1 to
# the one `sgm` was already pinned to, and `TimGM6mb.sf2` is `timgm6mb`'s byte count. The whole of
# §13 rests on that item, so it is worth knowing the three independent checks exist.
#
# Every row was additionally checked against the research note's measured file size before it was
# written down, which is the check that says "this is the bank the note measured" -- something no
# digest can say.
#
# ## What is deliberately NOT here
#
# **Nothing installs any of this into `assets/soundfont/`** except the bundled bank. Everything under
# `assets/` is copied into every release -- the .deb globs `assets/soundfont/*.sf2`, and the Windows
# folder, the macOS bundle, the Linux tarball and the APK take the tree wholesale -- so a 206 MiB
# override left there would be added to every carrier. A bank the owner adds lives in
# `data_dir/soundfonts/` and is chosen from the remote; see the `Choosing a bank from the remote`
# decision in docs/decisions/.
#
# **Only the bundled bank is shipped, and the rest are fetched.** §8 of the note reads the terms out
# of each file's own bytes, and `license` carries what it found per row, in the file's own words
# where it states any. Six of the second survey's banks assert "Public Domain" in their own `ICOP`
# and none of the six names its sample sources, so the column says both -- what the file claims, and
# what stands behind the claim.
#
# **Crisis General Midi 3.01 is still not here**, and it is now the only bank the survey has measured
# that has no source at all. Every other absence has been closed.
#
# **The order below is the order `--list` prints them in**: the nine ranked banks in rank order, then
# everything else by ascending loudness spread. Both readers take their order from this file, so
# moving a block moves the listing -- including `soundfont-debug.sh`, which fills its eight switcher
# slots from the top of this file downwards.


