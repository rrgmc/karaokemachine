# **The second bank published only inside an archive, and the reason that path is not a one-off.**
# SourceForge serves the Vanilla release as a zip; the member is `ColomboGMGS2_Vanilla.sf2` and both
# the archive and the extracted member are verified separately, because the second check is what says
