#
# §11 called this the strongest bank the survey had found and could give it no row, because nobody
# had a source for it. This is that source. It is also the widest bank measured anywhere here -- 892
# presets, 63 drum kits, 51 melodic banks.
#
# **It clips on real files, and it carries no `volume` anyway.** Over 989 corpus songs at
# `music_volume: 1.0`, 97 of them (10%) exceed -1 dBTP and the loudest reaches +7.2; the survey's
# seven songs did not. A `volume` derived the way this column's rule says -- the largest pre-clamp
# peak -- would be about 0.44, which is 7 dB off the recommended bank for the sake of one song in
# ten, so the reduction that is actually applied is the per-song one: `km_loudness::midi_gain` brings
# a loud song down and takes the corpus past -1 dBTP from 10% to 2%. See
# docs/research/midi-loudness.md.
#
# The CC-BY-SA claim is in the file, and the project's own credits name several other banks among its
# sample sources. The `license` column says both, which is why this row is fetched rather than
# bundled.
