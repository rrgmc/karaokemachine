[package]
name = "km-fixes"
description = "Per-song corrections for defects in a song file's own MIDI events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
km-song = { workspace = true }
serde = { workspace = true }
# A fix carries arguments, so the catch-all variant has to keep the JSON it could not read rather
# than remember only that there was some. `SongKind::Unknown` and `EditedField::Unknown` are scalars
# and need no such thing; see `Fix::Unknown` for the argument.
serde_json = { workspace = true }

[dev-dependencies]
km-song = { workspace = true, features = ["testing"] }
