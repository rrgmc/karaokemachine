[package]
name = "km-logsettings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The `logging` section of a settings file, for the programs nobody can pass an argument to."

[lints]
workspace = true

[dependencies]
# The two destinations this section names, so that a key and the flag beside it cannot disagree
# about what they accept: `parse_keep` reads `all` or a count, `parse_address` reads a viewer's
# address, and both refusals are written once.
km-ecapplog = { workspace = true }
km-logfile = { workspace = true }
# The section is JSON in somebody's settings file, and `peek` reads that file itself.
serde = { workspace = true }
serde_json = { workspace = true }
# Saying what could not be read, once there is a subscriber to say it to.
tracing = { workspace = true }
# `EnvFilter` is what `level` is checked against, because the key's whole grammar is the one
# `RUST_LOG` already has and a second parser would be a second answer.
tracing-subscriber = { workspace = true }
